<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didi Food — Dani Ponce (staging)</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../staging.css">
</head>
<body class="page-staging page-proyecto">
  <main>
    <a class="back-link" href="../decoracion.html" data-i18n="proyectos.volver">← volver a proyectos</a>

    <h1 class="proyecto-titulo">
      <span class="proyecto-titulo-title">Didi Food</span>
    </h1>

    <div class="stills-toolbar staging-nav" role="group" aria-label="Vista de galería" data-i18n-aria="proyectos.vistaGaleria">
      <button type="button" class="stills-view-btn" data-view="grid" aria-pressed="true" data-i18n="proyectos.vistaCuadricula">cuadrícula</button>
      <button type="button" class="stills-view-btn" data-view="list" aria-pressed="false" data-i18n="proyectos.vistaLista">lista</button>
    </div>

    <div class="stills-grid">
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/mesa_cenital.avif"><img src="../../assets/projects/didi-food/mesa_cenital.jpg" alt="Didi Food, mesa cenital" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/sala_4_amix.avif"><img src="../../assets/projects/didi-food/sala_4_amix.jpg" alt="Didi Food, sala con amigos" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/escaleras_4_amix.avif"><img src="../../assets/projects/didi-food/escaleras_4_amix.jpg" alt="Didi Food, escaleras con amigos" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/junta_wide.avif"><img src="../../assets/projects/didi-food/junta_wide.jpg" alt="Didi Food, junta de oficina" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/junta_close.avif"><img src="../../assets/projects/didi-food/junta_close.jpg" alt="Didi Food, junta de oficina, close-up" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/junta_kangre.avif"><img src="../../assets/projects/didi-food/junta_kangre.jpg" alt="Didi Food, junta de oficina" loading="lazy" decoding="async"></picture>
      <picture><source type="image/avif" srcset="../../assets/projects/didi-food/repartidor.avif"><img src="../../assets/projects/didi-food/repartidor.jpg" alt="Didi Food, repartidor" loading="lazy" decoding="async"></picture>
    </div>

    <section class="ficha-tecnica">
      <h2 data-i18n="proyectos.fichaTecnica">ficha técnica</h2>
      <dl>
        <div><dt data-i18n="creditos.tipo">Tipo</dt><dd>Comercial</dd></div>
        <div><dt data-i18n="creditos.direccion">Dirección</dt><dd>Sebastián Teitán</dd></div>
      </dl>
    </section>
  </main>

  <footer>
    <div class="lang-menu">
      <button id="lang-toggle" data-i18n="langBtn" aria-expanded="false" aria-controls="lang-list">idiomas</button>
      <ul class="lang-list" id="lang-list" hidden></ul>
    </div>
  </footer>

  <script src="../../js/translations.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
