<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="staging.css">
</head>
<body class="page-staging">
  <main>
    <section class="hero">
      <h1><a href="index.html" class="logo-word" aria-label="Dani Ponce">

        <img class="logo-letter" src="../assets/logo/letters/horizontal/2-n.png" alt="" style="--x:21.51%; --y:32.963%; --w:16.094%; --anim: letter-drift-h-3; --dur: 14.1s; --delay: -18.3s;">

        <img class="logo-letter" src="../assets/logo/letters/horizontal/4-p.png" alt="" style="--x:50.833%; --y:36.111%; --w:8.646%; --anim: letter-drift-h-5; --dur: 22.9s; --delay: -19.8s;">
        <img class="logo-letter" src="../assets/logo/letters/horizontal/5-o.png" alt="" style="--x:57.552%; --y:40.741%; --w:9.323%; --anim: letter-drift-h-6; --dur: 14.7s; --delay: -17.0s;">
        <img class="logo-letter" src="../assets/logo/letters/horizontal/6-n.png" alt="" style="--x:66.094%; --y:37.315%; --w:11.302%; --anim: letter-drift-h-7; --dur: 17.0s; --delay: -19.2s;">
        <img class="logo-letter" src="../assets/logo/letters/horizontal/7-c.png" alt="" style="--x:76.979%; --y:33.333%; --w:12.812%; --anim: letter-drift-h-8; --dur: 21.5s; --delay: -2.8s;">
        <img class="logo-letter" src="../assets/logo/letters/horizontal/8-e.png" alt="" style="--x:89.427%; --y:36.111%; --w:10.0%; --anim: letter-drift-h-9; --dur: 15.9s; --delay: -16.8s;">
      </a></h1>
      <p class="role" aria-live="polite" data-i18n="proyectos.directora">directora</p>
    </section>

    <div class="proyectos-filter staging-nav" role="group" aria-label="Filtrar por categoría">
      <button type="button" data-filter="all" aria-pressed="true" data-i18n="proyectos.filterAll">todos</button>
      <button type="button" data-filter="videoclip" aria-pressed="false" data-i18n="proyectos.categoriaVideoclip">videoclips</button>
      <button type="button" data-filter="no-ficcion" aria-pressed="false" data-i18n="proyectos.categoriaNoFiccion">no ficción</button>
    </div>

    <div class="proyectos-categories" data-filter="all">
      <section class="proyectos-category" data-category="videoclip">
        <h2 class="proyectos-category-title" data-i18n="proyectos.categoriaVideoclip">videoclips</h2>
        <div class="proyectos-grid">
          <a class="proyecto-tile" href="proyectos/erade-kafi.html">
            <span>Kafi — El refinado arte de extrañar</span>
          </a>
          <a class="proyecto-tile" href="proyectos/hoy-erandi.html">
            <span>E-randi — Hoy</span>
          </a>
          <a class="proyecto-tile" href="proyectos/westbound-khameleon.html">
            <span>Khameleon — Westbound</span>
          </a>
          <a class="proyecto-tile" href="proyectos/heroes-vicente-jauregui.html">
            <span>Vicente Jauregui — Héroes</span>
          </a>
          <a class="proyecto-tile" href="proyectos/presa-alamo-paraiso.html">
            <span>Alamo Paraiso — Presa</span>
          </a>
          <a class="proyecto-tile" href="proyectos/fantasma-astral.html">
            <span>Vicente Jauregui — Fantasma astral</span>
          </a>
          <a class="proyecto-tile" href="proyectos/satelite-futura-club.html">
            <span>Futura Club — Satélite</span>
          </a>
        </div>
      </section>

      <section class="proyectos-category" data-category="no-ficcion">
        <h2 class="proyectos-category-title" data-i18n="proyectos.categoriaNoFiccion">no ficción</h2>
        <div class="proyectos-grid">
          <a class="proyecto-tile" href="proyectos/archivo-digital.html">
            <span>Archivo Digital</span>
          </a>
          <a class="proyecto-tile" href="proyectos/la-verticalidad-desahuciada.html">
            <span>La Verticalidad Desahuciada</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="lang-menu">
      <button id="lang-toggle" data-i18n="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-list">idiomas</button>
      <ul class="lang-list" id="lang-list" role="listbox" hidden></ul>
    </div>
  </footer>

  <script src="../js/translations.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      var filterBar = document.querySelector('.proyectos-filter');
      var categories = document.querySelector('.proyectos-categories');
      if (!filterBar || !categories) return;
      filterBar.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        categories.dataset.filter = btn.dataset.filter;
        filterBar.querySelectorAll('button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === btn));
        });
      });
    })();
  </script>
</body>
</html>
